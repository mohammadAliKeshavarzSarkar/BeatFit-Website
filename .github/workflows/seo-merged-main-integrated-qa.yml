name: SEO Merged Main Integrated Browser Review
on:
  push:
    branches: [seo/merged-main-integrated-qa-2026-11-21]
permissions:
  contents: read
jobs:
  merged-main-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out QA-only script
        uses: actions/checkout@v4
        with:
          path: qa
      - name: Check out exact merged main revision
        uses: actions/checkout@v4
        with:
          ref: 0fa3d308ce600fe5bbe478a82d7ded577d8c90b6
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        working-directory: site
        run: npm ci
      - name: Build exact merged source
        working-directory: site
        run: npm run build
      - name: Verify generated SEO assets
        working-directory: site
        run: node scripts/verify-seo-build.mjs dist
      - name: Check no generated tracked public file drift
        working-directory: site
        run: git diff --exit-code -- public/robots.txt public/sitemap.xml public/web.config
      - name: Install temporary Chromium test dependency
        working-directory: site
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify merged zones article and disabled demo funnel in browser
        working-directory: site
        run: node ../qa/scripts/verify-merged-main-preview.mjs
